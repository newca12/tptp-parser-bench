# TPTP Parser Benchmarking Arena — Parser Configuration
#
# Each [[parsers]] entry defines a parser to benchmark.
# To add a new parser:
#   1. Add a [[parsers]] section below
#   2. Set `run_cmd` to the command that parses a TPTP file
#   3. Set `input_mode` to "file_arg" (file path as last argument) or "stdin"
#   4. Build the parser, then run: cargo run -p bench-runner

[settings]
iterations = 50           # Number of timed iterations per file
warmup_iterations = 5     # Warmup iterations (not timed)
timeout_secs = 30         # Per-invocation timeout in seconds

# ─── Rust Parsers ────────────────────────────────────────────────────────────

[[parsers]]
name = "tptp-nom"
display_name = "tptp (nom, zero-copy)"
language = "Rust"
technique = "nom streaming parser"
repository = "https://github.com/MichaelRawson/tptp"
run_cmd = ["./target/release/tptp-nom-wrapper"]
input_mode = "file_arg"
enabled = true

[[parsers]]
name = "tptp-antlr"
display_name = "tptp (ANTLR4)"
language = "Rust"
technique = "ANTLR4 generated parser"
repository = "https://github.com/newca12/playground-rs/tree/main/tptp"
run_cmd = ["./target/release/tptp-antlr-wrapper"]
input_mode = "file_arg"
enabled = true

[[parsers]]
name = "mrs-tptp"
display_name = "mrs-tptp (winnow)"
language = "Rust"
technique = "winnow parser combinators"
repository = "https://github.com/newca12/mrs"
run_cmd = ["./target/release/mrs-tptp-wrapper"]
input_mode = "file_arg"
enabled = true

# ─── C++ Parsers (via FFI) ──────────────────────────────────────────────────

[[parsers]]
name = "vampire-tptp"
display_name = "Vampire TPTP (hand-written)"
language = "C++"
technique = "hand-written recursive descent"
repository = "https://github.com/vprover/vampire"
run_cmd = ["./target/release/vampire-tptp-wrapper"]
input_mode = "file_arg"
enabled = true

# ─── Scala Parsers ──────────────────────────────────────────────────────────

[[parsers]]
name = "scala-tptp"
display_name = "scala-tptp-parser (combinators)"
language = "Scala"
technique = "Scala parser combinators"
repository = "https://github.com/leoprover/scala-tptp-parser"
run_cmd = ["java", "-jar", "parsers/scala-tptp-wrapper/target/scala-3.9.0/scala-tptp-wrapper.jar"]
input_mode = "file_arg"
enabled = true

# ─── Java Parsers ────────────────────────────────────────────────────────────

[[parsers]]
name = "java-antlr"
display_name = "tptp (ANTLR4, Java)"
language = "Java"
technique = "ANTLR4 generated parser"
repository = "https://github.com/newca12/playground-rs/tree/main/tptp"
run_cmd = ["java", "-jar", "parsers/java-antlr-wrapper/target/java-antlr-wrapper.jar"]
input_mode = "file_arg"
enabled = true

# ─── Template for adding new parsers ─────────────────────────────────────────
