[package]
name = "check-correctness"
version = "0.1.0"
edition = "2024"
description = "Correctness checker for TPTP parsers: roundtrip + cross-validation"

[[bin]]
name = "check-correctness"
path = "src/main.rs"

[dependencies]
# In-process Rust parsers
mrs-tptp = "=0.4.0"
tptp = "=0.31.1"
tptp-antlr = { git = "https://github.com/newca12/playground-rs.git", rev = "00428cd44348a3e05254e1834ea4a0ae3dba7a5f", package = "tptp" }
antlr4rust = "=0.6.0"

# CLI and utilities
clap = { version = "=4.6.7", features = ["derive"] }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"
wait-timeout = "=0.2.1"
