name: TPTP Parser Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ── Set up JVM wrappers ─────────────────────────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build Java ANTLR parser wrapper
        working-directory: parsers/java-antlr-wrapper
        run: mvn -q package

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            parsers/scala-tptp-wrapper/target
            parsers/scala-tptp-wrapper/project/target
          key: ${{ runner.os }}-sbt-${{ hashFiles('parsers/scala-tptp-wrapper/build.sbt', 'parsers/scala-tptp-wrapper/project/plugins.sbt') }}

      - name: Build scala-tptp-wrapper
        working-directory: parsers/scala-tptp-wrapper
        run: sbt assembly

      # ── Build Rust workspace and Rust parser wrappers ──────────────────
      - name: Build workspace (release)
        run: cargo build --release

      - name: Build Vampire parser wrapper
        run: cargo build --release --manifest-path parsers/vampire-tptp-wrapper/Cargo.toml --target-dir target -j 1

      # ── Run Criterion benchmarks (Rust-native parsers) ─────────────────
      - name: Run Criterion benchmarks
        run: cargo bench -p bench-native 2>&1 | tee criterion-output.txt

      # ── Run cross-parser benchmarks via bench-runner ───────────────────
      - name: Run bench-runner
        run: |
          cargo run --release -p bench-runner -- \
            --config parsers.toml \
            --corpus corpus \
            --output results

      # ── Upload HTML report as artifact ─────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: results/

  # Keep write access away from the job that executes configurable parser commands.
  publish-benchmarks:
    name: Publish benchmark history
    needs: benchmark
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-report
          path: results/

      - name: Store benchmark result (GitHub Action Benchmark)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "TPTP Parser Arena"
          tool: "customSmallerIsBetter"
          output-file-path: results/gh-bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: dev/bench
          comment-on-alert: true
          alert-threshold: "130%"

  # ── Deploy HTML report to GitHub Pages ───────────────────────────────────
  deploy-report:
    name: Deploy report to Pages
    needs: [benchmark, publish-benchmarks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-report
          path: report/

      - name: Publish report to GitHub Pages
        run: |
          mkdir -p public
          cp report/report.html public/index.html
          cp report/results.json public/results.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
